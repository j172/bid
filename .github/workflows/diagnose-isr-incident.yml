name: Diagnose ISR incident (one-off, read-only)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run diagnostics over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.NEW_DEPLOY_SSH_HOST || secrets.DEPLOY_SSH_HOST }}
          port: ${{ secrets.NEW_DEPLOY_SSH_PORT || secrets.DEPLOY_SSH_PORT }}
          username: ${{ secrets.NEW_DEPLOY_SSH_USER || secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.NEW_DEPLOY_SSH_PRIVATE_KEY || secrets.DEPLOY_SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script_path: scripts/diagnose-isr-incident.sh
