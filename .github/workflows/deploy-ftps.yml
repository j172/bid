name: Deploy prebuilt via FTPS

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Package prebuilt bundle
        run: |
          test -d .next
          tar -czf .prebuilt-next.tgz .next

          # Ships the whole public/ dir, not just tinymce: public/tinymce is
          # gitignored (postinstall copies it from node_modules/tinymce — see
          # scripts/copy-tinymce.mjs) so it only exists here in CI after
          # `npm ci`, never in the repo itself, but git-tracked public/ assets
          # (images/, etc.) need shipping too — they only exist in the repo,
          # never on the server otherwise. The server's index.php apply script
          # already knows how to extract an optional .prebuilt-public.tgz into
          # public/ (see .remote-index.php) — this is what actually feeds it one.
          if [ -d public ]; then
            tar -czf .prebuilt-public.tgz -C public .
          fi

      - name: Upload prebuilt bundle and handler to server (FTPS)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER != '' && secrets.FTP_SERVER || '103.21.221.12' }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME != '' && secrets.FTP_USERNAME || 'j172@j172.tw' }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          OPS_KEY: ${{ secrets.OPS_KEY }}
        run: |
          set -euo pipefail

          FTP_SERVER_CLEAN="$(printf '%s' "$FTP_SERVER" | tr -d '\r\n' | xargs)"
          FTP_USERNAME_CLEAN="$(printf '%s' "$FTP_USERNAME" | tr -d '\r\n' | xargs)"
          FTP_PASSWORD_CLEAN="$(printf '%s' "$FTP_PASSWORD" | tr -d '\r\n')"
          OPS_KEY_CLEAN="$(printf '%s' "$OPS_KEY" | tr -d '\r\n')"

          if [ -z "$FTP_SERVER_CLEAN" ] || [ -z "$FTP_USERNAME_CLEAN" ] || [ -z "$FTP_PASSWORD_CLEAN" ] || [ -z "$OPS_KEY_CLEAN" ]; then
            echo "Missing one of required deployment values: FTP_SERVER / FTP_USERNAME / FTP_PASSWORD / OPS_KEY"
            exit 1
          fi

          umask 077
          printf '%s' "$OPS_KEY_CLEAN" > .ops-key
          trap 'rm -f .ops-key' EXIT

          upload_with_retry() {
            local file_path="$1"
            local target_url="$2"
            local attempts=3

            if [ ! -f "$file_path" ]; then
              echo "Skip missing file: $file_path"
              return 0
            fi

            for attempt in $(seq 1 "$attempts"); do
              echo "Uploading $file_path (attempt $attempt/$attempts)"
              if curl --fail --show-error --ssl-reqd --ftp-pasv --insecure \
                --connect-timeout 15 --max-time 240 --retry 2 --retry-delay 2 --retry-all-errors \
                --user "${FTP_USERNAME_CLEAN}:${FTP_PASSWORD_CLEAN}" \
                --upload-file "$file_path" \
                --url "$target_url"; then
                return 0
              fi

              if [ "$attempt" -lt "$attempts" ]; then
                echo "Upload failed for $file_path, retrying..."
                sleep 3
              fi
            done

            echo "Upload failed after $attempts attempts: $file_path"
            return 1
          }

          upload_with_retry ".prebuilt-next.tgz" "ftp://${FTP_SERVER_CLEAN}:21/bid_app/.prebuilt-next.tgz"

          if [ -f ".prebuilt-public.tgz" ]; then
            upload_with_retry ".prebuilt-public.tgz" "ftp://${FTP_SERVER_CLEAN}:21/bid_app/.prebuilt-public.tgz"
          fi

          upload_with_retry "ecosystem.config.cjs" "ftp://${FTP_SERVER_CLEAN}:21/bid_app/ecosystem.config.cjs"

          # Shipped so the remote apply script can run `npm ci --omit=dev` on
          # the host before restarting pm2 — the host's node_modules is a
          # long-lived directory that's never `npm install`ed by this pipeline
          # otherwise, so a new dependency (e.g. node-cron, added for #45)
          # silently goes missing on the server even though CI built fine
          # against it, crashing the app at boot on the very next deploy.
          upload_with_retry "package.json" "ftp://${FTP_SERVER_CLEAN}:21/bid_app/package.json"
          upload_with_retry "package-lock.json" "ftp://${FTP_SERVER_CLEAN}:21/bid_app/package-lock.json"

          upload_with_retry ".remote-index.php" "ftp://${FTP_SERVER_CLEAN}:21/bid.j172.tw/index.php"

          upload_with_retry ".remote-htaccess" "ftp://${FTP_SERVER_CLEAN}:21/bid.j172.tw/.htaccess"

          upload_with_retry ".ops-key" "ftp://${FTP_SERVER_CLEAN}:21/bid.j172.tw/.ops-key"

      - name: Trigger apply and wait for completion
        # Runs scripts/remote-apply.sh directly on the host over SSH instead
        # of going through /__ops/apply + polling /__ops/status on the
        # public domain. That HTTP path goes through Cloudflare, and the
        # WAF/anti-bot layer there serves GitHub Actions runners a JS
        # challenge page instead of real content — /__ops/apply likely never
        # reached the PHP deploy logic, and /__ops/status polling just
        # collected challenge pages until timeout (see issue #64). SSH
        # bypasses Cloudflare entirely, and scripts/remote-apply.sh runs
        # synchronously, so this step's own exit code (from the SSH session)
        # already tells us whether the apply + health probe succeeded — no
        # separate polling loop needed.
        #
        # The /__ops/apply, /__ops/status, /__ops/pm2-status endpoints in
        # .remote-index.php are left in place for manual/browser debugging;
        # they're just no longer on this workflow's critical path.
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script_path: scripts/remote-apply.sh

      - name: Verify live site
        # Runs scripts/remote-verify.sh over SSH instead of curling
        # bid.j172.tw directly from the runner — confirmed (run 31170751366)
        # that the production WAF/anti-bot layer challenges GitHub Actions'
        # source IPs on every request to this Host, whether aimed at the
        # public domain or straight at the origin IP, so no retry/delay from
        # here would ever get past it. See scripts/remote-verify.sh's header
        # comment for the full story.
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          command_timeout: 3m
          script_path: scripts/remote-verify.sh
