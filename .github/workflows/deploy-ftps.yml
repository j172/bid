name: Deploy prebuilt via FTPS

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Package prebuilt bundle
        run: |
          test -d .next
          tar -czf .prebuilt-next.tgz .next

          # public/tinymce is gitignored (postinstall copies it from
          # node_modules/tinymce — see scripts/copy-tinymce.mjs) so it only
          # exists here in CI after `npm ci`, never in the repo itself. The
          # server's index.php apply script already knows how to extract an
          # optional .prebuilt-public.tgz into public/ (see .remote-index.php)
          # — this is what actually feeds it one.
          if [ -d public/tinymce ]; then
            tar -czf .prebuilt-public.tgz -C public tinymce
          fi

      - name: Upload prebuilt bundle and handler to server (FTPS)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER != '' && secrets.FTP_SERVER || '103.21.221.12' }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME != '' && secrets.FTP_USERNAME || 'j172@j172.tw' }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          OPS_KEY: ${{ secrets.OPS_KEY }}
        run: |
          set -euo pipefail

          FTP_SERVER_CLEAN="$(printf '%s' "$FTP_SERVER" | tr -d '\r\n' | xargs)"
          FTP_USERNAME_CLEAN="$(printf '%s' "$FTP_USERNAME" | tr -d '\r\n' | xargs)"
          FTP_PASSWORD_CLEAN="$(printf '%s' "$FTP_PASSWORD" | tr -d '\r\n')"
          OPS_KEY_CLEAN="$(printf '%s' "$OPS_KEY" | tr -d '\r\n')"

          if [ -z "$FTP_SERVER_CLEAN" ] || [ -z "$FTP_USERNAME_CLEAN" ] || [ -z "$FTP_PASSWORD_CLEAN" ] || [ -z "$OPS_KEY_CLEAN" ]; then
            echo "Missing one of required deployment values: FTP_SERVER / FTP_USERNAME / FTP_PASSWORD / OPS_KEY"
            exit 1
          fi

          umask 077
          printf '%s' "$OPS_KEY_CLEAN" > .ops-key
          trap 'rm -f .ops-key' EXIT

          upload_with_retry() {
            local file_path="$1"
            local target_url="$2"
            local attempts=3

            if [ ! -f "$file_path" ]; then
              echo "Skip missing file: $file_path"
              return 0
            fi

            for attempt in $(seq 1 "$attempts"); do
              echo "Uploading $file_path (attempt $attempt/$attempts)"
              if curl --fail --show-error --ssl-reqd --ftp-pasv --insecure \
                --connect-timeout 15 --max-time 240 --retry 2 --retry-delay 2 --retry-all-errors \
                --user "${FTP_USERNAME_CLEAN}:${FTP_PASSWORD_CLEAN}" \
                --upload-file "$file_path" \
                --url "$target_url"; then
                return 0
              fi

              if [ "$attempt" -lt "$attempts" ]; then
                echo "Upload failed for $file_path, retrying..."
                sleep 3
              fi
            done

            echo "Upload failed after $attempts attempts: $file_path"
            return 1
          }

          upload_with_retry ".prebuilt-next.tgz" "ftp://${FTP_SERVER_CLEAN}:21/bid_app/.prebuilt-next.tgz"

          if [ -f ".prebuilt-public.tgz" ]; then
            upload_with_retry ".prebuilt-public.tgz" "ftp://${FTP_SERVER_CLEAN}:21/bid_app/.prebuilt-public.tgz"
          fi

          upload_with_retry "ecosystem.config.cjs" "ftp://${FTP_SERVER_CLEAN}:21/bid_app/ecosystem.config.cjs"

          upload_with_retry ".remote-index.php" "ftp://${FTP_SERVER_CLEAN}:21/bid.j172.tw/index.php"

          upload_with_retry ".remote-htaccess" "ftp://${FTP_SERVER_CLEAN}:21/bid.j172.tw/.htaccess"

          upload_with_retry ".ops-key" "ftp://${FTP_SERVER_CLEAN}:21/bid.j172.tw/.ops-key"

      - name: Trigger apply and wait for completion
        env:
          OPS_KEY: ${{ secrets.OPS_KEY }}
        run: |
          set -euo pipefail
          OPS_KEY_CLEAN="$(printf '%s' "$OPS_KEY" | tr -d '\r\n')"

          curl --fail --show-error --silent --insecure \
            --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 2 --retry-all-errors \
            --resolve "bid.j172.tw:443:103.21.221.12" \
            "https://bid.j172.tw/__ops/apply?key=$OPS_KEY_CLEAN&cb=$(date +%s)"

          for ATTEMPT in $(seq 1 30); do
            STATUS="$(curl --fail --show-error --silent --insecure \
              --connect-timeout 10 --max-time 20 --retry 2 --retry-delay 2 --retry-all-errors \
              --resolve "bid.j172.tw:443:103.21.221.12" \
              "https://bid.j172.tw/__ops/status?key=$OPS_KEY_CLEAN&cb=$(date +%s)")"

            echo "$STATUS"

            if printf '%s' "$STATUS" | grep -Fq '[DONE]'; then
              exit 0
            fi

            if printf '%s' "$STATUS" | grep -Eiq '\[FAIL\]|\[ROLLBACK\]'; then
              echo "apply status indicates failure"
              exit 1
            fi

            echo "Waiting for apply completion ($ATTEMPT/30)..."
            sleep 2
          done

          echo "Timed out waiting for [DONE]"
          exit 1

      - name: Verify live site
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --insecure --location \
            --connect-timeout 10 --max-time 20 --retry 2 --retry-delay 2 --retry-all-errors \
            --resolve "bid.j172.tw:443:103.21.221.12" \
            "https://bid.j172.tw/api/health?verify=$(date +%s)" | grep -q '"ok":true'
